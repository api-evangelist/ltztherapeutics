description: LTZ Therapeutics is a clinical-stage immunotherapy biotechnology company developing novel
  myeloid engager therapeutics for cancer treatment. Its platform focuses on the direct engagement of
  myeloid cells with target cells to boost anti-tumor immunity, with lead candidate LTZ-232 receiving FDA
  IND clearance in July 2026 for advanced metastatic colorectal cancer and other solid tumors. The company
  operates from Redwood City, USA and Shenzhen, China. It is a portfolio company of Qiming and was added to
  the API Evangelist network as a stub for enrichment; it publishes no developer API surface.
